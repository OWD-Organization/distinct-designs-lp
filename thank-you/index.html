<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Distinct Designs Construction</title>
<meta name="description" content="Thank you for reaching out to Distinct Designs Construction. Our team will be in touch shortly.">

<!-- A confirmation page has no business in search results, and indexing it
     would also let people land here without ever filling the form. -->
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Shared by every landing page, so it carries its own CSS rather than
     reaching into one page folder's stylesheet. That keeps each landing page
     independently deployable and lets this file be pasted anywhere as-is. -->
<style>
:root {
  --color-charcoal-soft: #070614;
  --color-text-on-dark: #ffffff;
  --color-text-on-dark-muted: #d1dae5;
  --color-clay: #c8ab72;
  --color-on-accent: #0f172a;
  --color-hairline-on-dark: rgba(255, 255, 255, 0.16);

  --font-display: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --fs-hero: clamp(2.35rem, 4.4vw + 0.75rem, 4.25rem);
  --fs-body-lg: 1.2rem;
  --fs-eyebrow: 0.8rem;

  --space-2xs: 0.5rem;
  --space-xs: 0.75rem;
  --space-sm: 1.25rem;
  --space-md: 2rem;
  --space-lg: 3.25rem;

  --content-narrow: 760px;
  --radius: 2px;
  --ease-editorial: cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-lg) var(--space-sm);
  background-color: var(--color-charcoal-soft);
  color: var(--color-text-on-dark);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

.thanks {
  width: 100%;
  max-width: var(--content-narrow);
  text-align: center;
}

.thanks__mark {
  width: 64px;
  height: 64px;
  margin: 0 auto var(--space-md);
  border: 1px solid var(--color-clay);
  border-radius: 50%;
  display: grid;
  place-items: center;
}

.thanks__mark svg {
  width: 26px;
  height: 26px;
  stroke: var(--color-clay);
  stroke-width: 1.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.thanks__eyebrow {
  margin: 0 0 var(--space-sm);
  font-size: var(--fs-eyebrow);
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--color-clay);
}

.thanks__title {
  margin: 0 0 var(--space-sm);
  font-family: var(--font-display);
  font-size: var(--fs-hero);
  font-weight: 300;
  line-height: 1.08;
  letter-spacing: -0.01em;
}

.thanks__body {
  margin: 0 auto var(--space-lg);
  max-width: 48ch;
  font-size: var(--fs-body-lg);
  color: var(--color-text-on-dark-muted);
}

.thanks__back {
  display: inline-block;
  padding: var(--space-xs) var(--space-md);
  border: 1px solid var(--color-hairline-on-dark);
  border-radius: var(--radius);
  color: var(--color-text-on-dark);
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-decoration: none;
  transition: border-color var(--ease-editorial) 0.3s,
              background-color var(--ease-editorial) 0.3s,
              color var(--ease-editorial) 0.3s;
}

.thanks__back:hover,
.thanks__back:focus-visible {
  background-color: var(--color-clay);
  border-color: var(--color-clay);
  color: var(--color-on-accent);
}

:focus-visible { outline: 2px solid var(--color-clay); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<main class="thanks">

  <div class="thanks__mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" role="presentation"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
  </div>

  <p class="thanks__eyebrow">Request Received</p>

  <h1 class="thanks__title">Thank You</h1>

  <p class="thanks__body">
    We have received your request. Our team will be in touch shortly.
  </p>

  <!-- The client's own site, not "/": on Vercel that is the internal noindex
       hub listing every landing page, which is not somewhere to send a prospect. -->
  <a class="thanks__back" href="https://distinctdesignsconstruction.com/">Return to Distinct Designs Construction</a>

</main>

</body>
</html>
